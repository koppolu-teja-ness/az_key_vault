AWSTemplateFormatVersion: '2010-09-09'
Description: Stores database credentials in AWS Secrets Manager.
Parameters:
  SecretNamePrefix:
    Type: String
    Default: ''
    NoEcho: false
  DbUsername:
    Type: String
    Default: defaultDbUsername
    NoEcho: true
  DbPassword:
    Type: String
    Default: defaultDbPassword
    NoEcho: true
  KmsKeyId:
    Type: String
    Default: ''
    NoEcho: true
Conditions:
  UseCustomKmsKey:
    Fn::Not:
    - Fn::Equals:
      - Ref: KmsKeyId
      - ''
Resources:
  DbUsernameSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: ${SecretNamePrefix}/db-username
      Description: Database username
      SecretString:
        Ref: DbUsername
      KmsKeyId:
        Fn::If:
        - UseCustomKmsKey
        - Ref: KmsKeyId
        - Ref: AWS::NoValue
  DbPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: ${SecretNamePrefix}/db-password
      Description: Database password
      SecretString:
        Ref: DbPassword
      KmsKeyId:
        Fn::If:
        - UseCustomKmsKey
        - Ref: KmsKeyId
        - Ref: AWS::NoValue
Outputs:
  DbUsernameSecretName:
    Value:
      Fn::Sub: ${SecretNamePrefix}/db-username
    Description: Name of the db-username secret
  DbPasswordSecretName:
    Value:
      Fn::Sub: ${SecretNamePrefix}/db-password
    Description: Name of the db-password secret
  DbUsernameSecretArn:
    Value:
      Ref: DbUsernameSecret
    Description: ARN of the db-username secret
  DbPasswordSecretArn:
    Value:
      Ref: DbPasswordSecret
    Description: ARN of the db-password secret
